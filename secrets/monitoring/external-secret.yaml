apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-monitoring
    kind: SecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        admin-user: "{{ .username }}"
        admin-password: "{{ .passwird }}"
  data:
    - secretKey:  username
      remoteRef:
        key: monitoring/grafana-admin
        property: username
    - secretKey: password
      remoteRef:
        key: monitoring/grafana-admin
        property: password