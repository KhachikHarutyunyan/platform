apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-monitoring
  namespace: monitoring
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          role: "eso-monitoring-role"
          serviceAccountRef:
            name: eso-vault-monitoring
          mountPath: "kubernetes"
          audiences:
            - vault