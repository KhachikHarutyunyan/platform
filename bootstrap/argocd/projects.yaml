---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Core platform infrastructure (network, gateway, certs, moniotoring, vault)"
  sourceRepos:
    - "https://github.com/KhachikHarutyunyan/platform.git"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "argocd"
    - server: https://kubernetes.default.svc
      namespace: "cert-manager"
    - server: https://kubernetes.default.svc
      namespace: "envoy-gateway-system"
    - server: https://kubernetes.default.svc
      namespace: "monitoring"
    - server: https://kubernetes.default.svc
      namespace: "vault"
  clusterResourceWhitelist:
    - group: ""
      kind: "Namespace"
    - group: "apiextensions.k8s.io"
      kind: "CustomResourceDefinition"
    - group: "rbac.authorization.k8s.io"
      kind: "ClusterRoleBinding"
    - group: "networking.k8s.io"
      kind: "NetworkPolicy"
    - group: "gateway.networking.k8s.io"
      kind: "GatewayClass"
    - group: "cert-manager.io"
      kind: "ClusterIssuer"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: secrets
  namespace: argocd
spec:
  description: "Vault configuration and External Secrets Operator"
  sourceRepos:
    - "https://github.com/KhachikHarutyunyan/platform.git"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "vault"
    - server: https://kubernetes.default.svc
      namespace: "external-secrets"
    - server: https://kubernetes.default.svc
      namespace: "monitoring"
  clusterResourceWhitelist:
    - group: "external-secrets.io"
      kind: "ClusterSecretStore"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability
  namespace: argocd
spec:
  description: "Dashboards, alerts, ServiceMonitors, recording rules"
  sourceRepos:
    - "https://github.com/KhachikHarutyunyan/platform.git"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: moniotoring
  clusterResourceWhitelist: []