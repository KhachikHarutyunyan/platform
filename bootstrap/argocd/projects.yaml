---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Core platform infrastructure (network, gateway, certs, monitoring, vault)"
  sourceRepos:
    - "https://github.com/KhachikHarutyunyan/platform.git"
    - "https://charts.jetstack.io"
    - "oci://registry-1.docker.io/envoyproxy/gateway-helm"
    - "oci://registry-1.docker.io/envoyproxy/gateway-crds-helm"
    - "https://grafana-community.github.io/helm-charts"
    - "https://fluent.github.io/helm-charts"
    - "https://helm.releases.hashicorp.com"
    - "https://charts.external-secrets.io"
    - "https://prometheus-community.github.io/helm-charts"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "argocd"
    - server: https://kubernetes.default.svc
      namespace: "cert-manager"
    - server: https://kubernetes.default.svc
      namespace: "envoy-gateway-system"
    - server: https://kubernetes.default.svc
      namespace: "monitoring"
    - server: https://kubernetes.default.svc
      namespace: "vault"
    - server: https://kubernetes.default.svc
      namespace: "external-secrets"
    - server: https://kubernetes.default.svc
      namespace: "kube-system"
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: ""
      kind: Namespace
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding
    - group: gateway.networking.k8s.io
      kind: GatewayClass
    - group: ""
      kind: "ServiceAccount"
    - group: "rbac.authorization.k8s.io"
      kind: "Role"
    - group: "rbac.authorization.k8s.io"
      kind: "RoleBinding"
    - group: "networking.k8s.io"
      kind: "NetworkPolicy"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: secrets
  namespace: argocd
spec:
  description: "Vault configuration and External Secrets Operator"
  sourceRepos:
    - "https://github.com/KhachikHarutyunyan/platform.git"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "vault"
    - server: https://kubernetes.default.svc
      namespace: "argocd"
    - server: https://kubernetes.default.svc
      namespace: "external-secrets"
    - server: https://kubernetes.default.svc
      namespace: "monitoring"
  clusterResourceWhitelist:
    - group: external-secrets.io
      kind: ClusterSecretStore
    - group: external-secrets.io
      kind: ClusterExternalSecret
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability
  namespace: argocd
spec:
  description: "Dashboards, alerts, ServiceMonitors, recording rules"
  sourceRepos:
    - "https://github.com/KhachikHarutyunyan/platform.git"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: monitoring
  clusterResourceWhitelist: []