apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: oci://registry-1.docker.io/envoyproxy/gateway-helm
      targetRevision: v1.8.0
      path: .
      helm:
        releaseName: envoy-gateway
        skipCrds: true
        valueFiles:
          - $values/infrastructure/envoy-gateway/chart/values.yaml
    - repoURL: "https://github.com/KhachikHarutyunyan/platform.git"
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true