apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-vault-audit
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Security"
data:
  vault-audit.json: |
    {
      "title": "Vault Audit & Seal Status",
      "uid": "vault-audit",
      "panels": [
        {
          "type": "logs",
          "title": "Vault Audit Log (Loki)",
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "{namespace=\"vault\", container=\"vault\", stream=\"stdout\"} | json",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 0 }
        },
        {
          "type": "stat",
          "title": "Vault Unsealed (1 = unsealed, 0 = sealed)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "vault_core_unsealed",
              "refId": "B"
            }
          ],
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 10 }
        }
      ],
      "schemaVersion": 39,
      "version": 1
    }