apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-manager-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: cert-manager
      interval: 30s
      rules:
        - alert: CertificateExpiryWarning
          expr: |
            (certmanager_certificate_expiration_timestamp_seconds - time()) < 7 * 24 * 3600
            and
            (certmanager_certificate_expiration_timestamp_seconds - time()) > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.name }} expires in < 7 days"
            description: "Certificate {{ $labels.name }} in namespace {{ $labels.exported_namespace }} expires in {{ $value | humanizeDuration }}."
        - alert: CertificateExpirCritical
          expr: |
            (certmanager_certificate_expiration_timestamp_seconds - time()) < 48 * 3600
            and
            (certmanager_certificate_expiration_timestamp_seconds - time()) > 0
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ $labels.name }} expires in < 48 hours"
        - alert: CertificateNotReady
          expr: |
            certmanager_certificate_ready_status{condition="False"} == 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ $labels.name }} is not ready"
            description: "Certificate {{ $labels.name }} has been in NotReady state for 15 minutes. Check CertificateRequest and Order events."
        - alert: CertManagerAbsent
          expr: |
            absent(up{job="cert-manager"} == 1)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "cert-manager is absent from Prometheus"
            description: "cert-manager metrics have disappeared for 15 minutes. The controller may be down."