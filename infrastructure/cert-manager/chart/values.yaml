crds:
  enabled: false

global:
  leaderElection:
    namespace: cert-manager

# --- Controller ---
replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

livenessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5

# --- Webhook ---
webhook:
  replicaCount: 1
  timeoutSeconds: 30
  securePort: 10260
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  securityContext:
    seccompProfile:
      type: RuntimeDefault
    runAsNonRoot: true
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
  networkPolicy:
    enabled: true
    ingress:
      - from:
          - namespaceSelector: {}
          - ipBlock:
              cidr: 192.168.56.0/24
          - ipBlock: # ip range for kind
              cidr: 172.18.0.0/24
        ports:
          - port: 10260

startupapicheck:
  timeout: 5m

# --- CA Injector ---
cainjector:
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 256Mi
  securityContext:
    seccompProfile:
      type: RuntimeDefault
    runAsNonRoot: true
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true


# --- Prometheus ServiceMonitor ---
prometheus:
  enabled: true
  servicemonitor:
    enabled: false
    labels:
      release: kube-prometheus-stack

# --- PDB ---
podDisruptionBudget:
  enabled: false