# --- Deploy mode ---
deploymentMode: Monolithic
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: local-path
    enableStatefulSetAutoDeletePVC: false

# --- ServiceMonitor ---
monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack

# --- Loki Configs ---
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  
  storage:
    type: filesystem

  limits_config:
    retention_period: 168h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
  
  compactor:
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 150
    working_directory: /var/loki/compacter
    shared_store: filesystem

# --- Resources ---
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

