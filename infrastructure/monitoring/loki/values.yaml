# --- Deploy mode ---
deploymentMode: Monolithic
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: local-path
    enableStatefulSetAutoDeletePVC: false
  # --- Resources ---
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- SimpleScalable ---
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# --- ServiceMonitor ---
monitoring:
  serviceMonitor:
    enabled: false
    labels:
      release: kube-prometheus-stack

# --- Loki Configs ---
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  
  storage:
    type: filesystem

  limits_config:
    retention_period: 168h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    allow_structured_metadata: true
  
  compactor:
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 150
    working_directory: /var/loki/compacter
    shared_store: filesystem