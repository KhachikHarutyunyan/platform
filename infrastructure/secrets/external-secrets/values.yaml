# --- CRD disabled and controlled separately
installCRDs: false

# --- Controller ---
replicaCount: 1
leaderElect: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

# --- Webhook ---
webhook:
  replicaCount: 1
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# --- Cert Controller ---
certController:
  replicaCount: 1
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

processClusterStore: true
processClusterExternalSecret: true

# --- Prometheus ServiceMonitor ---
serviceMonitor:
  enabled: false
  labels:
    release: kube-prometheus-stack

# --- SecurityContext ---
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault