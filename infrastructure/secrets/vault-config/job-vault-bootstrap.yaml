apiVersion: batch/v1
kind: Job
metadata:
  name: vault-bootstrap
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: vault-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: vault-bootstrap
          image: hashicorp/vault:1.16.2
          env:
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-admin-token
                  key: token
          command:
            - /bin/sh
            - -ec
            - |
              set -x

              echo ">>> Start auth-method kubernetes"
              vault auth enable kubernetes 2>/dev/null || true

              echo ">>> Configure auth/kubernetes/config"
              vault write auth/kubernetes/config \
                kubernetes_host="https://kubernetes.default.svc:443" \
                kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                token_reviewer_jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token \
                disable_iss_validation=true

              echo ">>> Create policy eso-policy"
              vault policy write eso-policy /vault/policies/policy-eso.hcl

              echo ">>> Create role eso-role for ESO"
              vault write auth/kubernetes/role/eso-role \
                bound_service_account_names=external-secrets \
                bound_service_account_namespaces=external-secrets \
                policies=eso-policy \
                ttl=1h

              echo ">>> Enable KV v2 by secret/ path"
              vault secrets enable -path=secret -version=2 kv 2>/dev/null || true

              echo ">>> Bootstrap Vault finished"
          volumeMounts:
            - name: policies
              mountPath: /vault/policies
              readOnly: true
      volumes:
        - name: policies
          configMap:
            name: vault-policy-eso
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-bootstrap
  namespace: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-bootstrap
  namespace: vault
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-bootstrap
  namespace: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-bootstrap
subjects:
  - kind: ServiceAccount
    name: vault-bootstrap
    namespace: vault