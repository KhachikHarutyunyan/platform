apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-bootstrap
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-bootstrap
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: vault-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: vault-bootstrap
          image: hashicorp/vault:1.16.2
          env:
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-admin-token
                  key: token
          command:
            - /bin/sh
            - -ec
            - |
              vault auth enable kubernetes 2>/dev/null || true

              # Без token_reviewer_jwt: Vault использует токен своего пода
              vault write auth/kubernetes/config \
                kubernetes_host="https://${KUBERNETES_PORT_443_TCP_ADDR}:443" \
                kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

              vault secrets enable -path=secret -version=2 kv 2>/dev/null || true

              vault policy write eso-policy /vault/policies/policy-eso.hcl
              vault write auth/kubernetes/role/eso-role \
                bound_service_account_names=external-secrets \
                bound_service_account_namespaces=external-secrets \
                policies=eso-policy audience=vault ttl=1h

              vault policy write eso-monitoring-policy /vault/policies/policy-eso-monitoring.hcl
              vault write auth/kubernetes/role/eso-monitoring-role \
                bound_service_account_names=eso-vault-monitoring \
                bound_service_account_namespaces=monitoring \
                policies=eso-monitoring-policy audience=vault ttl=1h
          volumeMounts:
            - name: policies
              mountPath: /vault/policies
              readOnly: true
      volumes:
        - name: policies
          configMap:
            name: vault-policy-eso