apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-policy-eso
  namespace: vault
data:
  policy-admin.hcl: |
    path "sys/auth/*" {
      capabilities = ["create", "read", "update", "delete", "list", "sudo"]
    }

    path "sys/policies/acl/*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }

    path "sys/mounts/*" {
      capabilities = ["create", "read", "update", "delete", "list", "sudo"]
    }

    path "sys/mounts" {
      capabilities = ["read", "list"]
    }

    path "auth/kubernetes/*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }

    path "secret/*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }

    # Disable root pathes
    path "sys/raw/*" {
      capabilities = ["deny"]
    }

    path "sys/replication/*" {
      capabilities = ["deny"]
    }

    path "sys/seal" {
      capabilities = ["deny"]
    }
    
  policy-eso.hcl: |
    path "secret/data/*" {
      capabilities = ["read"]
    }

    path "secret/metadata/*" {
      capabilities = ["read", "list"]
    }

    path "secret/metadata" {
      capabilities = ["list"]
    }